<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Average Engineering Student 😂</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f1f1f1;
transition:0.15s;
text-align:center;
overflow-x:hidden;
}

h1{
font-size:70px;
margin:30px;
color:#ff0066;
text-shadow:3px 3px yellow;
}

.main{
display:flex;
justify-content:center;
margin-top:30px;
}

.rainbow{
padding:10px;
border-radius:25px;
background:linear-gradient(45deg,red,orange,yellow,green,cyan,blue,violet,red);
background-size:400%;
animation:rainbow 3s linear infinite;
}

.rainbow img{
width:550px;
height:550px;
border-radius:20px;
display:block;
transition:0.5s;
}

.rainbow img:hover{
transform:scale(1.08) rotate(3deg);
filter:brightness(120%);
}

@keyframes rainbow{
0%{background-position:0%;}
100%{background-position:400%;}
}

marquee{
margin-top:20px;
background:red;
color:white;
font-size:35px;
padding:15px;
font-weight:bold;
}

button{
margin:40px;
padding:18px 35px;
font-size:28px;
border:none;
border-radius:12px;
background:#ff4081;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.1);
background:#ff1744;
}

.gallery{
display:flex;
justify-content:space-around;
align-items:center;
margin:40px;
opacity:0;
}

.left,.right{
width:320px;
height:320px;
border-radius:20px;
transition:1.2s;
}

.left{
transform:translateX(-900px);
}

.right{
transform:translateX(900px);
}

.gallery.show{
opacity:1;
}

.gallery.show .left,
.gallery.show .right{
transform:translateX(0);
}

.gallery img{
width:100%;
height:100%;
border-radius:20px;
transition:.4s;
}

.gallery img:hover{
transform:scale(1.08);
}

p{
font-size:35px;
font-weight:bold;
margin-top:15px;
}
</style>

</head>
<body>

<h1>
🤣😂😆 Average Engineering Student 🤣😂😆
</h1>

<div class="main">
<div class="rainbow">
<img src="https://images.squarespace-cdn.com/content/v1/5d6700e799e03b0001e82f2b/bdfe3305-d181-4882-88ab-7d63a80d9cef/meme+13.jpg" alt="Main Funny Image 😂">
</div>
</div>

<marquee scrollamount="150">
🤣😂 Assignment tomorrow... Start today ❌ Start tonight ❌ Start at 3 AM ✅🤣😂😆
</marquee>

<button onclick="showImages()">
😂 Show More Memes 😂
</button>

<div class="gallery" id="gallery">

<div>
<img class="left" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3gWHNKr7Fi80lUXO3cRoqe_vzCj8rEwD7WYNkCj-b1-nGJ5tCREWy53U&s=10" alt="Funny Image 1 🤣">
<p>😂 Sleep is Temporary 😂</p>
</div>

<div>
<img class="right" src="https://i.pinimg.com/736x/e0/c4/cb/e0c4cb163a156dabf828886267c68f3b.jpg" alt="Funny Image 2 🤣">
<p>🤣 CGPA is Forever 🤣</p>
</div>

</div>

<script>
function showImages(){
document.getElementById("gallery").classList.add("show");
}

window.addEventListener("scroll",function(){

let colors=[
"#ff1744",
"#00e5ff",
"#76ff03",
"#ffea00",
"#ff3d00",
"#d500f9",
"#1de9b6",
"#ff4081",
"#18ffff",
"#7c4dff"
];

document.body.style.background=
colors[Math.floor(Math.random()*colors.length)];

});
</script>

</body>
</html>
