<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    width:350px;
}

h1{
    margin-bottom:25px;
    color:#333;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    padding:12px 22px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    color:white;
    transition:0.3s;
}

#inc{
    background:#28a745;
}

#dec{
    background:#dc3545;
}

#reset{
    background:#007bff;
}

button:hover{
    transform:scale(1.08);
}

#count{
    margin-top:30px;
    font-size:120px;
    font-weight:bold;
    color:#333;
}
</style>

</head>
<body>

<div class="container">
    <h1>Counter App</h1>

    <div class="buttons">
        <button id="dec">-</button>
        <button id="reset">Reset</button>
        <button id="inc">+</button>
    </div>

    <div id="count">0</div>
</div>

<script>
let count = 0;

const display = document.getElementById("count");

document.getElementById("inc").onclick = function(){
    count++;
    display.innerHTML = count;
    console.log(count);
}

document.getElementById("dec").onclick = function(){
    count--;
    display.innerHTML = count;
      console.log(count);
}

document.getElementById("reset").onclick = function(){
    count = 0;
    display.innerHTML = count;
      console.log(count);
}
</script>

</body>
</html>
