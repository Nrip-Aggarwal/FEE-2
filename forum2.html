<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeVerse Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:burlywood;
}

/* ================= NAVBAR ================= */

nav{
    width:100%;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
    flex-wrap:wrap;
    gap:15px;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#333;
}

nav ul{
    list-style:none;
    display:flex;
    gap:25px;
}

nav ul li a{
    text-decoration:none;
    color:black;
    font-weight:bold;
    transition:.3s;
}

nav ul li a:hover{
    color:#ffc107;
}

.notification{
    position:relative;
    font-size:24px;
}

.notification span{
    position:absolute;
    top:-8px;
    right:-10px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:red;
    color:white;
    font-size:11px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ================= LOGIN ================= */

.container{
    min-height:calc(100vh - 80px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.login-box{
    width:100%;
    max-width:380px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:20px;
    color:white;
    border:2px solid black;
    position:relative;
}

.cross{
    position:absolute;
    right:20px;
    top:15px;
    color:maroon;
    font-size:20px;
    cursor:pointer;
}

.login-box h1{
    text-align:center;
    margin-bottom:25px;
    font-size:35px;
    -webkit-text-stroke:1px black;
}

.input-box{
    position:relative;
    margin:20px 0;
}

.input-box input{
    width:100%;
    padding:14px 45px 14px 15px;
    border:none;
    outline:none;
    border-radius:30px;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:16px;
    border:2px solid black;
}

.input-box input::placeholder{
    color:white;
}

.input-box i{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0;
    font-size:14px;
    flex-wrap:wrap;
    gap:10px;
}

.options a{
    color:white;
    text-decoration:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:#0d6efd;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#084298;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}


@media (max-width:768px){

    nav{
        padding:18px 25px;
        justify-content:center;
        text-align:center;
    }

    nav ul{
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
    }

    .logo{
        width:100%;
        text-align:center;
    }

    .notification{
        margin-top:10px;
    }

}


@media (max-width:480px){

    nav{
        padding:15px;
    }

    .logo{
        font-size:25px;
    }

    nav ul{
        gap:15px;
    }

    nav ul li a{
        font-size:14px;
    }

    .login-box{
        padding:25px;
    }

    .login-box h1{
        font-size:28px;
    }

    .input-box input{
        padding:12px 42px 12px 15px;
        font-size:15px;
    }

    button{
        font-size:16px;
    }

    .options{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<nav>

<div class="logo">CodeVerse</div>

<ul>
    <li><a href="#">HOME</a></li>
    <li><a href="#">ABOUT</a></li>
    <li><a href="#">CONTACT</a></li>
</ul>

<div class="notification">
    <i class="fa-solid fa-bell fa-shake"></i>
    <span>5</span>
</div>

</nav>

<div class="container">

<div class="login-box">

<span class="cross">
<i class="fa-solid fa-x"></i>
</span>

<h1>Login</h1>

<form>

<div class="input-box">
<input type="text" placeholder="Username">
<i class="fa-solid fa-user"></i>
</div>

<div class="input-box">
<input type="password" placeholder="Password">
<abbr title="Password should be at least 8 characters">
<i class="fa-solid fa-lock"></i>
</abbr>
</div>

<div class="options">
<label><input type="checkbox"> Remember</label>
<a href="#">Forgot Password?</a>
</div>

<button type="submit">Login</button>

<div class="register">
<p>New User? <a href="#">Register</a></p>
</div>

</form>

</div>

</div>

</body>
</html>
